<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Zeffyr Map</title>

<style>
@font-face {
  font-family: 'Minecraft';
  src: url('minecraft.ttf') format('truetype');
}

body {
  margin: 0;
  background: #111;
  overflow: hidden;
}

.navbar {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background-color: #1c1c1eda;
  backdrop-filter: blur(20px);
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 500;
}

.nav-links {
  list-style: none;
  display: flex;
  gap: 25px;
  font-family: 'Minecraft', sans-serif;
  margin: 0;
  padding: 0;
}

.nav-links li {
  opacity: 0;
  transform: translateY(10px);
  animation: fadeIn 0.2s ease forwards;
}

@keyframes fadeIn {
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

.nav-links li:nth-child(1) { animation-delay: 0.1s; }
.nav-links li:nth-child(2) { animation-delay: 0.2s; }
.nav-links li:nth-child(3) { animation-delay: 0.3s; }
.nav-links li:nth-child(4) { animation-delay: 0.4s; }

.nav-links a {
  text-decoration: none;
  color: #fff;
  position: relative;
}

.nav-links a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -8px;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #fff, transparent);
  transform: scaleX(0);
  transition: transform 0.3s ease;
}

.nav-links a:hover::after {
  transform: scaleX(1);
}

/* IFRAME */
.map-container {
  position: absolute;
  top: 80px; /* высота navbar */
  left: 0;
  right: 0;
  bottom: 0;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
</head>

<body>

<nav class="navbar">
  <ul class="nav-links">
    <li><a href="https://www.zeffyr.net">Играть</a></li>
    <li><a href="https://store.zeffyr.net/">Донатик</a></li>
    <li><a href="#" style="color: rgb(196,196,253);">Карта</a></li>
    <li><a href="https://www.zeffyr.net/rules">Правила</a></li>
  </ul>
</nav>

<div class="map-container">
  <iframe src="https://map.zeffyr.net"></iframe>
</div>

</body>
</html>
